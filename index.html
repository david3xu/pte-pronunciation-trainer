<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#4a5568" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PTE Vocabulary Pronunciation Trainer</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <!-- CSS loaded in order: variables -> animations -> components -> layouts -->
    <link rel="stylesheet" href="src/css/variables.css?v=1">
    <link rel="stylesheet" href="src/css/animations.css?v=1">
    <link rel="stylesheet" href="src/css/components.css?v=2">
    <link rel="stylesheet" href="src/css/style.css?v=16">
</head>

<body>
    <div class="app-layout-grid">
        <!-- Minimalist header - hidden on mobile -->
        <header class="app-header">
            <h1 class="app-title">🎧 PTE Vocabulary</h1>
        </header>

        <!-- Main learning area (80% of screen height) -->
        <main class="learning-area">
            <div class="word-display">
                <div class="phonetic-spelling" id="phoneticSpelling" style="display: none;"></div>
                <div class="english-word-container">
                    <span class="word-type-badge" id="wordTypeBadge" style="display: none;"></span>
                    <span class="english-word" id="englishWord">Press PLAY to start learning</span>
                </div>
                <div class="ipa-notation" id="ipaNotation" style="display: none;"></div>
                <div class="pronunciation" id="pronunciationText" style="display: none;"></div>
                <div class="example-sentence" id="exampleSentence" style="display: none;">Example sentence will appear
                    here</div>
                <div class="simple-progress" id="progressText">Ready to start</div>
                <div class="difficulty-badge" id="difficultyBadge" style="display: none;">🟢 Easy</div>
            </div>
        </main>

        <!-- Essential controls (20% of screen height) -->
        <section class="control-area">
            <div class="primary-controls">
                <button class="btn btn--secondary" id="prevBtn">⏮️ PREV</button>
                <button class="btn btn--primary btn--large" id="startBtn">▶️ PLAY</button>
                <button class="btn btn--primary btn--large" id="pauseBtn" style="display: none;">⏸️ PAUSE</button>
                <button class="btn btn--secondary" id="nextBtn">⏭️ NEXT</button>
            </div>
            <div class="context-bar">
                <span class="current-category" id="categoryDisplay">PTE FIB Listening</span>
                <div class="action-buttons">
                    <button class="btn-pronunciation" id="pronunciationToggleBtn"
                        title="Toggle British/American pronunciation">🇬🇧</button>
                    <button class="btn-fullscreen" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
                    <button class="btn-settings" id="settingsBtn">⚙️</button>
                </div>
            </div>
        </section>

        <!-- Collapsible settings panel -->
        <div class="settings-panel collapsed" id="settingsPanel">
            <div class="settings-header">
                <h2 class="settings-title">Settings</h2>
                <button class="btn-close-settings" id="closeSettingsBtn" aria-label="Close settings">✕</button>
            </div>
            <div class="settings-grid">
                <!-- Practice Mode Selection (Phase 2) -->
                <div class="setting-item">
                    <label for="practiceModeSelect">Practice Type:</label>
                    <select id="practiceModeSelect">
                        <!-- Options populated dynamically from Config.js data.practiceModes -->
                    </select>
                </div>
                
                <!-- Learning Mode Selection (Vocabulary Book Selector) - Only for vocabulary mode -->
                <div class="setting-item" id="vocabularyBookSetting">
                    <label for="learningModeSelect">Vocabulary Book:</label>
                    <select id="learningModeSelect">
                        <!-- Options populated dynamically from Config.js data.learningModes -->
                    </select>
                </div>
                
                <!-- Dataset Selection - Only for practice modes (RS/ASQ/WFD) -->
                <div class="setting-item" id="practiceDatasetSetting" style="display: none;">
                    <label for="practiceDatasetSelect">Dataset:</label>
                    <select id="practiceDatasetSelect">
                        <!-- Options populated dynamically from Config.js data.practiceDatasets -->
                    </select>
                </div>
                <!-- Note: Category filter removed - each book currently contains only one category.
                     When datasets are enhanced with subcategories (e.g., Grammar, Vocabulary, Idioms),
                     add back: <select id="categorySelect">...</select> -->
                <div class="setting-item">
                    <label for="difficultySelect">Difficulty Level:</label>
                    <select id="difficultySelect">
                        <!-- Options populated dynamically from Config.js -->
                    </select>
                </div>
                <div class="setting-item">
                    <label for="speedSelect">Speed:</label>
                    <select id="speedSelect">
                        <!-- Options populated dynamically from Config.js -->
                    </select>
                </div>
                <div class="setting-item">
                    <label for="delaySelect">Pause:</label>
                    <select id="delaySelect">
                        <!-- Options populated dynamically from Config.js -->
                    </select>
                </div>
                <div class="setting-item">
                    <label for="repeatSelect">Repeat:</label>
                    <select id="repeatSelect">
                        <!-- Options populated dynamically from Config.js -->
                    </select>
                </div>
                <div class="setting-item">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect">
                        <!-- Options populated dynamically via VoiceSelector.js -->
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Status display for screen readers -->
    <div class="sr-only" id="statusDisplay" aria-live="polite"></div>

    <!-- Debug script to verify data loading -->
    <script>
        // Debug utilities for development (remove in production build)
        if (typeof DEBUG === 'undefined' || DEBUG) {
            window.debugVocab = {
                checkData: function () {
                    console.log('=== Debug Vocabulary Check ===');
                    console.log('PTEVocabularyManager loaded:', typeof window.pteVocabularyManager !== 'undefined');

                    if (window.pteVocabularyManager) {
                        console.log('Current words count:', window.pteVocabularyManager.getCurrentWords().length);
                        console.log('All words count:', window.pteVocabularyManager.getAllWords().length);
                        console.log('Current mode:', window.pteVocabularyManager.currentLearningMode);
                        console.log('Current difficulty:', window.pteVocabularyManager.getCurrentDifficulty());
                    }
                }
            };
        }
    </script>

    <!-- Shared Infrastructure (must load first) -->
    <script src="src/js/shared/Config.js?v=1759740000"></script>
    <script src="src/js/shared/DataSchema.js?v=1759740000"></script>
    <!-- LegacyCompatibility.js removed - Phase 3 cleanup: Never initialized or used -->

    <!-- Utility Modules -->
    <script src="src/js/utils/EventBus.js?v=1759740000"></script>
    <script src="src/js/utils/Storage.js?v=1759740000"></script>
    <script src="src/js/utils/StateManager.js?v=1759740000"></script>
    <script src="src/js/utils/StateTest.js?v=1759740000"></script>
    <script src="src/js/utils/CacheMigration.js?v=1759740000"></script>

    <!-- Core Logic Modules -->
    <script src="src/js/core/SettingsModule.js?v=1759740000"></script>
    <script src="src/js/core/PTEVocabularyManager.js?v=1759740000"></script>
    <script src="src/js/core/ProgressTracker.js?v=1759740000"></script>

    <!-- Data Extractors -->
    <script src="src/js/data/extractors/PTETermsExtractor.js?v=1759740000"></script>
    
    <!-- NEW: Phase 2 - Dataset Manager -->
    <script src="src/js/data/DatasetManager.js?v=1759740000"></script>

    <!-- Audio Modules -->
    <script src="src/js/audio/TTSEngine.js?v=1759740000"></script>
    <script src="src/js/audio/VoiceSelector.js?v=1759740000"></script>
    <script src="src/js/audio/AudioControls.js?v=1759740000"></script>

    <!-- UI Modules -->
    <script src="src/js/ui/UIController.js?v=1759740000"></script>
    <script src="src/js/ui/SettingsPanel.js?v=1759740000"></script>

    <!-- Main App Coordinator -->
    <script src="src/js/core/PTEApp.js?v=1759740000"></script>
</body>

</html>
