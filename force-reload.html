<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Force Cache Clear</title>
</head>
<body>
    <h1>Clearing Cache...</h1>
    <p id="status">Please wait...</p>
    
    <script>
        async function forceCacheClear() {
            const status = document.getElementById('status');
            
            try {
                // 1. Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    status.textContent = `Found ${registrations.length} service workers. Unregistering...`;
                    
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('Service Worker unregistered:', registration);
                    }
                }
                
                // 2. Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    status.textContent = `Found ${cacheNames.length} caches. Deleting...`;
                    
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        console.log('Cache deleted:', cacheName);
                    }
                }
                
                // 3. Clear localStorage and sessionStorage
                localStorage.clear();
                sessionStorage.clear();
                
                status.textContent = '✅ Cache cleared! Redirecting to app...';
                
                // 4. Redirect to main app
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
                
            } catch (error) {
                status.textContent = '❌ Error: ' + error.message;
                console.error('Cache clear error:', error);
            }
        }
        
        // Run on page load
        forceCacheClear();
    </script>
</body>
</html>
