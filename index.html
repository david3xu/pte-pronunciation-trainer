<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#4a5568" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PTE Vocabulary Pronunciation Trainer</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="src/css/style.css?v=13">
</head>

<body>
    <div class="app-layout-grid">
        <!-- Minimalist header - hidden on mobile -->
        <header class="app-header">
            <h1 class="app-title">🎧 PTE Vocabulary</h1>
        </header>

        <!-- Main learning area (80% of screen height) -->
        <main class="learning-area">
            <div class="word-display">
                <div class="phonetic-spelling" id="phoneticSpelling" style="display: none;"></div>
                <div class="english-word" id="englishWord">Press PLAY to start learning</div>
                <div class="ipa-notation" id="ipaNotation" style="display: none;"></div>
                <div class="pronunciation" id="pronunciationText" style="display: none;"></div>
                <div class="example-sentence" id="exampleSentence" style="display: none;">Example sentence will appear
                    here</div>
                <div class="simple-progress" id="progressText">Ready to start</div>
                <div class="difficulty-badge" id="difficultyBadge" style="display: none;">🟢 Easy</div>
            </div>
        </main>

        <!-- Essential controls (20% of screen height) -->
        <section class="control-area">
            <div class="primary-controls">
                <button class="btn-nav" id="prevBtn">⏮️ PREV</button>
                <button class="btn-play" id="startBtn">▶️ PLAY</button>
                <button class="btn-play" id="pauseBtn" style="display: none;">⏸️ PAUSE</button>
                <button class="btn-nav" id="nextBtn">⏭️ NEXT</button>
            </div>
            <div class="context-bar">
                <span class="current-category" id="categoryDisplay">PTE FIB Listening</span>
                <div class="action-buttons">
                    <button class="btn-pronunciation" id="pronunciationToggleBtn"
                        title="Toggle British/American pronunciation">🇬🇧</button>
                    <button class="btn-fullscreen" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
                    <button class="btn-settings" id="settingsBtn">⚙️</button>
                </div>
            </div>
        </section>

        <!-- Collapsible settings panel -->
        <div class="settings-panel collapsed" id="settingsPanel">
            <div class="settings-header">
                <h2 class="settings-title">Settings</h2>
                <button class="btn-close-settings" id="closeSettingsBtn" aria-label="Close settings">✕</button>
            </div>
            <div class="settings-grid">
                <!-- Learning Mode Selection -->
                <div class="setting-item">
                    <label for="learningModeSelect">Mode:</label>
                    <select id="learningModeSelect">
                        <option value="pte-fib-listening" selected>🎧 PTE FIB Listening</option>
                    </select>
                </div>
                <!-- PTE categories -->
                <div class="setting-item">
                    <label for="categorySelect">Category:</label>
                    <select id="categorySelect">
                        <option value="all-categories" selected>🌟 All Categories</option>
                        <option value="pte-fib-listening">🎧 FIB Listening</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="difficultySelect">Level:</label>
                    <select id="difficultySelect">
                        <option value="normal" selected>🟡 Normal (All PTE Terms)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="speedSelect">Speed:</label>
                    <select id="speedSelect">
                        <option value="0.7" selected>Slow</option>
                        <option value="1.0">Normal</option>
                        <option value="1.3">Fast</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="delaySelect">Pause:</label>
                    <select id="delaySelect">
                        <option value="1000">1 sec</option>
                        <option value="2000" selected>2 sec</option>
                        <option value="3000">3 sec</option>
                        <option value="4000">4 sec</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="repeatSelect">Repeat:</label>
                    <select id="repeatSelect">
                        <option value="once" selected>1x - Term Only</option>
                        <option value="individual">2x - Slow+Normal</option>
                        <option value="intensive">3x - Slow+Normal+Fast + Example</option>
                        <option value="loop">Loop + Examples</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect">
                        <option value="auto">🎯 Auto (Best Match)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Status display for screen readers -->
    <div class="sr-only" id="statusDisplay" aria-live="polite"></div>

    <!-- Debug script to verify data loading -->
    <script>
        // Debug functions for console testing
        window.debugVocab = {
            checkData: function () {
                console.log('=== Debug Vocabulary Check ===');
                console.log('VocabularyManager loaded:', typeof window.vocabularyManager !== 'undefined');

                if (window.vocabularyManager) {
                    console.log('Current words count:', window.vocabularyManager.getTotalWords());
                    console.log('Category counts:', window.vocabularyManager.getCategoryCounts());
                    console.log('Available learning modes:', window.vocabularyManager.getAvailableModes?.());
                }
            }
        };
    </script>

    <!-- NEW: Shared Infrastructure (must load first) -->
    <script src="src/js/shared/AppNamespace.js?v=1759720029"></script>
    <script src="src/js/shared/Config.js?v=1759723320"></script>
    <script src="src/js/shared/DataSchema.js?v=1759720029"></script>
    <script src="src/js/shared/LegacyCompatibility.js?v=1759720029"></script>

    <!-- Utility Modules -->
    <script src="src/js/utils/EventBus.js?v=1759721912"></script>
    <script src="src/js/utils/Storage.js?v=1759721912"></script>
    <script src="src/js/utils/StateManager.js?v=1759720029"></script>
    <script src="src/js/utils/StateTest.js?v=1759720029"></script>
    <script src="src/js/utils/CacheMigration.js?v=1759722042"></script>

    <!-- Core Logic Modules -->
    <script src="src/js/core/SettingsManager.js?v=1759723320"></script>
    <script src="src/js/core/PTEVocabularyManager.js?v=1759721071"></script>
    <script src="src/js/core/ProgressTracker.js?v=1759721071"></script>

    <!-- Data Extractors -->
    <script src="src/js/data/extractors/PTETermsExtractor.js?v=1759720029"></script>

    <!-- Audio Modules -->
    <script src="src/js/audio/TTSEngine.js?v=1759720029"></script>
    <script src="src/js/audio/VoiceSelector.js?v=1759720029"></script>
    <script src="src/js/audio/AudioControls.js?v=1759723320"></script>

    <!-- UI Modules -->
    <script src="src/js/ui/UIController.js?v=1759722042"></script>
    <script src="src/js/ui/SettingsPanel.js?v=1759722042"></script>

    <!-- Main App Coordinator -->
    <script src="src/js/core/PTEApp.js?v=1759721071"></script>
</body>

</html>
